<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Content mix chart preview</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; font-family: system-ui, sans-serif; }
    .card { width: 320px; background: #121212; border-radius: 16px; padding: 20px 20px 20px; color: #fff; }
    h2 { margin: 0; font-size: 15px; font-weight: 600; display: inline; }
    .badge { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; background: #1b3a2a; color: #4ade80; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 600; }
    .sub { margin: 6px 0 0; color: #8a8a8a; font-size: 13px; }
    svg { display: block; margin: 20px auto 0; width: 220px; height: 220px; }
    ul { list-style: none; margin: 20px 0 0; padding: 0; display: flex; justify-content: center; gap: 20px; }
    li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .sw { width: 10px; height: 10px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <h2>Content mix</h2>
      <span class="badge">↗ 44%</span>
      <p class="sub">Share of assets by channel</p>
    </div>
    <svg id="chart" viewBox="0 0 240 240"></svg>
    <ul id="legend"></ul>
  </div>
  <script>
    const COLORS = ["#d0d0d0", "#555555", "#2a2a2a"];
    const slices = [
      { channel: "Direct", count: 44 },
      { channel: "Email", count: 36 },
      { channel: "Social", count: 20 },
    ];
    const count = 100;
    const radius = 78;
    const strokeWidth = 36;
    const circumference = 2 * Math.PI * radius;
    const gap = strokeWidth + 6;

    function labelInk(hex) {
      const c = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16)/255);
      const [r,g,b] = c.map(v => v <= 0.03928 ? v/12.92 : ((v+0.055)/1.055)**2.4);
      const L = 0.2126*r + 0.7152*g + 0.0722*b;
      return (L+0.05)/0.0652 >= 1.05/(L+0.05) ? "#1a1a1a" : "#ececec";
    }

    const svg = document.getElementById("chart");
    slices.forEach((item, index) => {
      const fraction = item.count / count;
      const offset = slices.slice(0, index).reduce((s, e) => s + e.count / count, 0);
      const mid = offset + fraction / 2;
      const angle = mid * Math.PI * 2 - Math.PI / 2;
      const dash = Math.max(fraction * circumference - gap, 0.01);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", "120");
      circle.setAttribute("cy", "120");
      circle.setAttribute("r", String(radius));
      circle.setAttribute("fill", "none");
      circle.setAttribute("stroke", COLORS[index]);
      circle.setAttribute("stroke-width", String(strokeWidth));
      circle.setAttribute("stroke-linecap", "round");
      circle.setAttribute("stroke-dasharray", `${dash} ${circumference}`);
      circle.setAttribute("stroke-dashoffset", String(-offset * circumference - gap / 2));
      circle.setAttribute("transform", "rotate(-90 120 120)");
      g.appendChild(circle);
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", String(120 + Math.cos(angle) * radius));
      text.setAttribute("y", String(120 + Math.sin(angle) * radius));
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("fill", labelInk(COLORS[index]));
      text.setAttribute("font-size", "15");
      text.setAttribute("font-weight", "700");
      text.textContent = Math.round(fraction * 100) + "%";
      g.appendChild(text);
      svg.appendChild(g);
    });

    const legend = document.getElementById("legend");
    slices.forEach((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="sw" style="background:${COLORS[index]}"></span>${item.channel}`;
      legend.appendChild(li);
    });
  </script>
</body>
</html>
